name: Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "fluxapay_frontend/**"
  pull_request:
    branches: ["main"]
    paths:
      - "fluxapay_frontend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fluxapay_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fluxapay_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fluxapay_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fluxapay_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit / component tests
        run: npm test

  e2e-tests:
    name: E2E Tests (mocked)
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    defaults:
      run:
        working-directory: ./fluxapay_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fluxapay_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build

      - name: Start app and run E2E tests
        run: |
          npm start &
          npx wait-on http://localhost:3075 --timeout 120000 --interval 2000
          npm run test:e2e
        env:
          CI: true
          E2E_MODE: mocked
          PLAYWRIGHT_BASE_URL: http://localhost:3075
          E2E_BASE_URL: http://localhost:3075

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: fluxapay_frontend/playwright-report/
          retention-days: 7
