name: SDK Release

on:
  push:
    tags:
      - "sdk-v*.*.*"
      - "python-sdk-v*.*.*"
      - "go-sdk-v*.*.*"

jobs:
  # ── JS/TS SDK → npm ─────────────────────────────────────────────────────────
  publish-js-sdk:
    name: Publish @fluxapay/sdk to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'sdk-v')
    defaults:
      run:
        working-directory: ./fluxapay_sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: fluxapay_sdk/package-lock.json

      - name: Validate tag matches package version
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Python SDK → PyPI ────────────────────────────────────────────────────────
  publish-python-sdk:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'python-sdk-v')
    defaults:
      run:
        working-directory: ./fluxapay_python_sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python-sdk-v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION != pyproject.toml $PKG_VERSION"
            exit 1
          fi

      - name: Install build deps
        run: pip install build pytest pytest-asyncio respx httpx

      - name: Run tests
        run: pytest tests/ -v

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: fluxapay_python_sdk/dist/
          password: ${{ secrets.PYPI_TOKEN }}

  # ── Go SDK → tag validation ─────────────────────────────────────────────────
  validate-go-sdk:
    name: Validate Go SDK
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'go-sdk-v')
    defaults:
      run:
        working-directory: ./fluxapay_go_sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Validate tag matches go.mod module path
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#go-sdk-v}"
          echo "Releasing Go SDK v$TAG_VERSION"
          go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Build check
        run: go build ./...
