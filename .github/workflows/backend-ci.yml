name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "fluxapay_backend/**"
  pull_request:
    branches: ["main"]
    paths:
      - "fluxapay_backend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Quality & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxapay_ci_placeholder?schema=public
    defaults:
      run:
        working-directory: ./fluxapay_backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fluxapay_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Validate OpenAPI spec
        run: npm run validate:openapi

      - name: Check route documentation coverage
        run: npm run check:route-coverage -- --ci

      - name: Build
        run: npm run build

  unit-and-contract-tests:
    name: Unit, Contract & Smoke Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxapay_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-key
      KMS_PROVIDER: local
      KMS_ENCRYPTION_PASSPHRASE: ci-test-passphrase-for-hd-wallet-secure
      HD_WALLET_MASTER_SEED: ci-test-master-seed-32chars-long-padded!!
      DISABLE_CRON: "true"
      WEBHOOK_SECRET: ci-test-webhook-secret
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      RESEND_API_KEY: re_test
      SMS_PROVIDER: mock
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
      FUNDER_SECRET_KEY: SBXEHJKWF7C7BIFSUGXZE7XKFJ5SP6Y7JGPD4J4TKMX2MQXWQQRF3BSG
      MASTER_VAULT_SECRET_KEY: SDGHCAPDRWTOTBAQT6HJ5KBUZOECD2JEOH6E76NDL4OXNBXIWODLZA4B
      USDC_ISSUER_PUBLIC_KEY: GBVXGET7UCLTTLDZGVWDDMZ7FVLCNZL75GU7BLVPTWUP6UIVYHAY5OAX
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxapay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./fluxapay_backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fluxapay_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check migrations are in sync with schema
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Sync database schema
        run: npx prisma db push

      - name: Run unit tests
        run: npm test

      - name: Run contract tests
        run: npm run test:contract
        env:
          PAYMENT_RATE_LIMIT_PER_MINUTE: "10000"

      - name: Build backend & run smoke tests
        run: |
          npm run build
          npm start &
          npx --yes wait-on@9.0.4 http://localhost:3000/health --timeout 120000 --interval 2000
          npm run test:smoke
        env:
          API_BASE_URL: http://localhost:3000
